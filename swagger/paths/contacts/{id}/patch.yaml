tags:
  - Contacts
summary: Update contact
operationId: patchContact
description: 'Update a contact with the provided payload. Only fields in the request body will be updated.'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '65ca76e7ae7f10c88b55674'
    description: ID of the contact to update
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: "Ivan Ivanenko"
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380698785532'
          email:
            description: "Contact's email"
            type: string
            example: 'ivanenko@example.com'
          isFavourite:
            description: "Is this contact marked as a favorite?"
            type: boolean
            example: true
          contactType:
            description: "Contact's type"
            type: string
            enum: ['personal', 'home', 'work']
            example: home
          photo:
            description: Link to contact's photo
            type: string
            format: binary
responses:
  '200':
    description: Successfully updated a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully updated a contact!
            data:
              type: object
              $ref: ../../../components/schemas/updateContact.yaml
  '400':
    $ref: ../../../components/responses/400.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
